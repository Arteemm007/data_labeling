version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: assessor_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: assessor_backend
    ports:
      - "8000:8000"
    env_file:
      - .env  # <-- Указываем брать переменные из корневого файла .env
    depends_on:
      - postgres

volumes:
  pgdata: