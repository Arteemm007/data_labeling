[project]
name = "assessor-platform-backend"
version = "1.0.0"
description = "Система разметки и перекрестной проверки документов"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.6",
    "alembic>=1.11.0",
    "Pillow>=10.0.0",
    "PyMuPDF>=1.22.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]